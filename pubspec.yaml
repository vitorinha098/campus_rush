name: campus_rush
description: Projeto Prático PM 2026 - Campus Rush
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Motor de Jogo e Áudio
  flame: ^1.18.0
  flame_audio: ^2.1.6

  # Firebase Backend
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3

  # Estado e Rotas
  provider: ^6.1.2
  go_router: ^14.3.0

  # Recursos Nativos e Utilitários
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true